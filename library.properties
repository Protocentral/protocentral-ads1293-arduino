name=ProtoCentral ADS1293 ECG Library
version=2.0.0
author=ProtoCentral Electronics <support@protocentral.com>
maintainer=ProtoCentral Electronics <support@protocentral.com>
sentence=Driver for the TI ADS1293 three-channel 24-bit ECG front end on the ProtoCentral ADS1293 Breakout.
paragraph=3-lead and 5-lead ECG at 25 SPS to 1.6 kSPS (up to 6.4 kSPS per channel with the fast modulator), with every ADS1293 feature: flexible input routing, Wilson and Goldberger terminals, right-leg drive, DC / analog-AC / digital-AC lead-off detection, digital and analog pace channels, battery / supply monitoring, test signals, error and alarm registers, external clock and multi-board clock sync. Polled or interrupt-driven, verified register writes, conversion to microvolts, and an OpenView streaming example. For research and education only - not a medical device.
category=Sensors
url=https://github.com/Protocentral/protocentral-ads1293-arduino
architectures=*
