name: Compile Examples

on:
  push:
    paths:
      - "src/**"
      - "examples/**"
      - "library.properties"
      - ".github/workflows/compile-examples.yml"
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "library.properties"
      - ".github/workflows/compile-examples.yml"
  workflow_dispatch:

# Every core an ADS1293 breakout is realistically plugged into. The library has
# no dependencies beyond SPI, and every example fits on a 2 KB AVR.
jobs:
  build:
    name: ${{ matrix.board.name }}
    # compile-sketches pins Python 3.12.4, which has no Ubuntu 26.04 build (ubuntu-latest)
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        board:
          - name: Arduino Uno
            fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
          - name: Arduino Nano
            fqbn: arduino:avr:nano
            platforms: |
              - name: arduino:avr
          - name: Arduino Mega
            fqbn: arduino:avr:mega
            platforms: |
              - name: arduino:avr
          - name: Arduino Leonardo
            fqbn: arduino:avr:leonardo
            platforms: |
              - name: arduino:avr
          - name: Arduino Uno R4 WiFi
            fqbn: arduino:renesas_uno:unor4wifi
            platforms: |
              - name: arduino:renesas_uno
          - name: Arduino Nano 33 BLE
            fqbn: arduino:mbed_nano:nano33ble
            platforms: |
              - name: arduino:mbed_nano
          - name: Adafruit Feather nRF52840
            fqbn: adafruit:nrf52:feather52840
            platforms: |
              - name: adafruit:nrf52
                source-url: https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          - name: ESP32 Dev Module
            fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          - name: ESP32-S3
            fqbn: esp32:esp32:esp32s3
            platforms: |
              - name: esp32:esp32
                source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          - name: ESP32-C3
            fqbn: esp32:esp32:esp32c3
            platforms: |
              - name: esp32:esp32
                source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          - name: Raspberry Pi Pico (RP2040)
            fqbn: rp2040:rp2040:rpipico
            platforms: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Adafruit nRF52 core packages a DFU zip as part of every compile
      - name: Install adafruit-nrfutil
        if: startsWith(matrix.board.fqbn, 'adafruit:nrf52')
        run: pip3 install adafruit-nrfutil

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          # The whole platforms block travels in the matrix entry: emitting an empty
          # `source-url:` for an Arduino-official core makes compile-sketches crash in
          # install_platforms() (None.rstrip()).
          platforms: ${{ matrix.board.platforms }}
          sketch-paths: |
            - examples
          enable-warnings-report: true
